services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market
    volumes: ["market-db:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
  api:
    build: .
    command: marketplace-api
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
    env_file: [.env]
  worker:
    build: .
    command: marketplace-worker
    depends_on: [postgres, redis]
    env_file: [.env]
volumes:
  market-db:

